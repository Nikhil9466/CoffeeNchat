services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coffeenchat
      POSTGRES_USER: coffeenchat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U coffeenchat -d coffeenchat']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment: &backend-env
      SQLALCHEMY_DATABASE_URL: postgresql://coffeenchat:${POSTGRES_PASSWORD}@db:5432/coffeenchat
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set a random JWT_SECRET_KEY in root .env}
      APP_ENV: ${APP_ENV:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    command: [python, manage.py, migrate]
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment: *backend-env
    volumes:
      - uploads:/app/backend/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready',timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 3
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  database:
  uploads:
